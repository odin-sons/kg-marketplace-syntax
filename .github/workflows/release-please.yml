name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For --oidc below: exchanged for a short-lived Marketplace credential,
      # trusted via a policy configured on the publisher's Marketplace page -
      # no stored secret. Requires a publisher-side trust policy naming this
      # repo + this workflow file - see CONTRIBUTING.md.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned to an exact prerelease: OIDC trusted publishing (--oidc, below)
      # landed 2026-07-23 and isn't in a stable @vscode/vsce release yet - a
      # bare `npx @vscode/vsce` would resolve to the latest STABLE (3.9.2),
      # which doesn't have the flag. Bump this once a stable release ships.
      - run: npx --yes @vscode/vsce@3.9.3-8 package
      - name: Attach .vsix to the GitHub Release
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" *.vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@3.9.3-8 publish --packagePath *.vsix --oidc
